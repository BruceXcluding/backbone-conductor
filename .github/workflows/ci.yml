name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.1'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: BACKBONE_REQUIRE_LIVE_HTTP=1 uv run --no-sync pytest --cov=backbone_conductor --cov-fail-under=85 --cov-report=term-missing
      - run: uv run --no-sync python scripts/evaluate.py
      - run: uv run --no-sync python scripts/evaluate_git_merges.py
      - run: uv run --no-sync python scripts/benchmark_mcp.py --clients 10
      - run: uv run --no-sync python examples/demo.py
      - run: uv build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.1'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run --no-sync python scripts/verify_compose.py
  dsh-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.1'
          python-version: '3.12'
      - run: uv sync --locked --group dev --extra dsh
      - run: BACKBONE_REQUIRE_DSH_MCP=1 PYTHONPATH=src uv run --no-sync pytest tests/test_runtime.py::test_installed_sdk_starts_read_only_review_without_shell tests/test_runtime.py::test_installed_sdk_starts_member_mcp_without_model_call -q
